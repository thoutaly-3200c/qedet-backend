spring.application.name=Qedet
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/qedet?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
qedet.attendance.qr-encryption-key=${ATTENDANCE_QR_ENCRYPTION_KEY:qedet-local-attendance-qr-encryption-key-change-in-production}
server.address=0.0.0.0
server.port=8080
#server.error.include-message=always

logging.level.org.springframework.web=DEBUG
logging.level.q.qedet.auth=DEBUG
logging.level.q.qedet.common.config.SecurityConfig=DEBUG

# ==============================
# Frontend
# ==============================
# Browser origin used for Google OAuth redirects (dev/staging/prod).

qedet.frontend.cors-allowed-origins=${QEDET_FRONTEND_CORS_ALLOWED_ORIGINS:https://qedet.net,https://www.qedet.net,http://localhost:8443,https://localhost:8443,https://192.168.0.103:8443}
qedet.frontend.base-url=${QEDET_FRONTEND_BASE_URL:https://qedet.net}
qedet.frontend.invitation-accept-redirect-url=${QEDET_FRONTEND_INVITATION_ACCEPT_REDIRECT_URL:https://qedet.net/login}
qedet.backend.base-url=${QEDET_BACKEND_BASE_URL:https://api.qedet.net}
qedet.frontend.oauth-callback-path=${QEDET_FRONTEND_OAUTH_CALLBACK_PATH:/auth/oauth/callback}


# ==============================
# Email
# ==============================
qedet.email.enabled=${QEDET_EMAIL_ENABLED:true}
qedet.email.from=${MAIL_FROM:noreply@qedet.net}
qedet.email.from-name=${MAIL_FROM_NAME:Qedet}


# ==============================
# Zoho SMTP
# ==============================
spring.mail.host=${MAIL_HOST:smtp.zoho.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:noreply@qedet.net}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


#google Oauth
server.forward-headers-strategy=framework
spring.security.oauth2.client.registration.google.redirect-uri=https://api.qedet.net/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
